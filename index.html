<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>air링크 뷰어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  /* air 디자인 가이드 — 에디터와 동일 토큰 */
  --ink:#111417;--black:#0B0F10;--ink60:#5B6066;--ink40:#8B9096;--ink20:#C9CDD2;
  --line:#E6E8EB;--line2:#F1F2F4;--base:#F1F2F5;--white:#fff;
  --blue:#2C64F6;--blue-soft:#EEF3FF;
  --cobalt:var(--blue);--cobalt-soft:var(--blue-soft);--signal:#FFC400;
  --alert:#E5484D;--ok:#2C64F6;--call:#2BB24C;
  --r:10px;--rc:12px;--rl:16px;
  --font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);background:#EEF0F3;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;gap:26px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- air 워드마크 ---------- */
.logo{display:block;height:24px;width:auto;flex:0 0 auto}

/* ---------- 사이드 패널 ---------- */
#aside{width:236px;flex:0 0 236px;display:none}
@media(min-width:940px) and (min-height:860px){#aside{display:block}}
#aside .kick{font-size:11.5px;font-weight:700;color:var(--blue);margin-bottom:6px}
#aside h1{font-size:20px;font-weight:800;letter-spacing:-.03em}
#aside p{font-size:12.5px;line-height:1.65;color:var(--ink60);margin-top:10px}
#aside p b{color:var(--ink)}
#aside h4{font-size:12px;font-weight:600;color:var(--ink60);margin:20px 0 9px}
.flow{border-top:1px solid #D9DCE1;padding-top:14px}
.fs{display:flex;gap:9px;padding:7px 0;font-size:12.5px;color:var(--ink40);align-items:flex-start}
.fs i{width:18px;height:18px;border-radius:50%;background:#D9DDE3;color:#fff;flex:0 0 18px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-style:normal;margin-top:1px}
.fs.on{color:var(--ink);font-weight:700}
.fs.on i{background:var(--blue)}
.fs.done i{background:var(--black)}
.fs em{display:block;font-style:normal;font-weight:400;font-size:11px;color:var(--ink40);margin-top:2px}
.cond{border-top:1px solid #D9DCE1;padding-top:14px;margin-top:16px}
.cond button{
  display:flex;align-items:center;width:100%;text-align:left;font-size:12.5px;font-weight:600;padding:10px 12px;
  border-radius:var(--r);background:#fff;color:var(--ink);border:1px solid var(--line);margin-bottom:6px;
}
.cond button .cl{flex:1}
.cond button em{display:block;font-style:normal;font-weight:400;font-size:11px;color:var(--ink40);margin-top:2px}
.cond button .ck{color:var(--ink20);display:flex}
.cond button[aria-pressed=true]{border:1.5px solid var(--black);padding:9.5px 11.5px}
.cond button[aria-pressed=true] .ck{color:var(--black)}
#aside .reset{margin-top:12px;font-size:12px;font-weight:600;color:var(--blue);padding:4px 0}
#aside .io{margin-top:8px;font-size:12px;font-weight:600;color:var(--ink);height:40px;border:1px solid var(--line);border-radius:var(--r);background:#fff;width:100%}
#aside .io:hover{border-color:var(--ink40)}
#aside .wipe{margin-top:8px;font-size:12px;font-weight:600;color:var(--alert);height:40px;border:1px solid #F0D2D3;border-radius:var(--r);background:#fff;width:100%}

/* ---------- device ---------- */
#device{
  width:390px;height:100%;max-height:844px;background:var(--white);
  position:relative;overflow:hidden;display:flex;flex-direction:column;
}
@media(min-width:460px) and (min-height:880px){
  #device{border-radius:42px;box-shadow:0 24px 70px rgba(16,20,30,.16);height:844px}
}
@media(max-width:459px){body{background:#fff}}
#device.bg-lock{background:linear-gradient(165deg,#5A74B8 0%,#33406A 55%,#1E2540 100%)}
#device.bg-call{background:#111417}
.statusbar{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:600;color:var(--ink40);z-index:5;position:relative}
.statusbar.light{color:rgba(255,255,255,.8)}
.view{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---------- 다이얼 (폰 기본 키패드) ---------- */
.dial{background:#fff;height:100%;display:flex;flex-direction:column}
.dial-top{flex:0 0 auto;padding:10px 20px 0}
.dial-tabs{display:flex;gap:4px;background:var(--base);border-radius:var(--r);padding:3px}
.dial-tabs span{flex:1;text-align:center;font-size:12px;font-weight:600;padding:8px 0;border-radius:8px;color:var(--ink40)}
.dial-tabs span.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.dial-num{text-align:center;font-size:40px;font-weight:600;letter-spacing:.04em;padding:34px 0 8px;min-height:96px}
.dial-num em{font-style:normal;color:var(--blue)}
.dial-num .ph{color:var(--ink20);font-size:15px;font-weight:500;letter-spacing:-.01em}
.dial-hint{text-align:center;font-size:12.5px;color:var(--ink40);min-height:18px}
.dial-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding:18px 38px 0}
.dial-keys button{
  aspect-ratio:1;border-radius:50%;background:#F3F4F6;font-size:27px;font-weight:500;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:background .1s,transform .07s;
}
.dial-keys button:active{background:#E4E7EC;transform:scale(.94)}
.dial-keys button small{font-size:9px;font-weight:700;color:var(--ink40);letter-spacing:.08em;margin-top:1px}
.dial-call{display:flex;justify-content:center;align-items:center;gap:30px;padding:20px 0 24px;margin-top:auto}
.callbtn{width:68px;height:68px;border-radius:50%;background:var(--call);color:#fff;font-size:27px;display:flex;align-items:center;justify-content:center;transition:transform .08s}
.callbtn:active{transform:scale(.94)}
.callbtn:disabled{background:#D5D9DE}
.delbtn{font-size:22px;color:var(--ink60);width:52px}

/* ---------- 통화 중 ---------- */
.calling{height:100%;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.calling .cn{font-size:36px;font-weight:600;letter-spacing:.03em}
.calling .cn em{font-style:normal;color:#6E95FF}
.calling .cs{font-size:13px;color:#959BA4}
.calling .cv{
  margin-top:26px;font-size:12px;color:#C9CDD2;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  padding:12px 18px;border-radius:var(--rc);text-align:center;line-height:1.55;max-width:250px;
}
.calling .cv b{display:block;color:#fff;font-weight:600;margin-bottom:3px}
.dots{display:flex;gap:5px;margin-top:20px}
.dots i{width:6px;height:6px;border-radius:50%;background:#565D67;animation:bl 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s}
.dots i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.35}30%{opacity:1}}

/* ---------- 알림 단계 ---------- */
.lock{position:absolute;inset:0;overflow:hidden}
.lock::after{content:"";position:absolute;left:-30%;top:-20%;width:160%;height:70%;background:radial-gradient(ellipse at center,rgba(255,255,255,.14),transparent 62%)}
.locktime{position:absolute;top:72px;left:0;right:0;text-align:center;color:#fff;z-index:2}
.locktime b{display:block;font-size:62px;font-weight:300;letter-spacing:-.02em}
.locktime span{font-size:13.5px;color:rgba(255,255,255,.76)}
.notif{position:absolute;top:186px;left:12px;right:12px;z-index:4;animation:drop .3s cubic-bezier(.2,.9,.3,1)}
@keyframes drop{from{transform:translateY(-26px);opacity:0}to{transform:none;opacity:1}}
.card{
  background:rgba(250,250,252,.95);backdrop-filter:blur(16px);border-radius:18px;
  padding:14px 15px;display:flex;gap:11px;box-shadow:0 12px 34px rgba(10,14,22,.28);
  width:100%;text-align:left;align-items:flex-start;
}
.card .ci{width:38px;height:38px;border-radius:10px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;background:#fff;border:1px solid var(--line)}
.card .ci .logo{height:13px}
.card .ci.sms{background:var(--call);border:none;font-size:17px}
.card .cc{flex:1;min-width:0}
.card .cc b{display:block;font-size:14px;font-weight:700}
.card .cc p{font-size:13px;color:var(--ink60);margin-top:2px;line-height:1.42}
.card .ct{font-size:11px;color:var(--ink40);flex:0 0 auto}
.tapme{text-align:center;margin-top:14px;font-size:12px;font-weight:600;color:rgba(255,255,255,.85)}

/* 시스템 팝업 */
.sysmask{position:absolute;inset:0;background:rgba(11,15,16,.45);z-index:4;display:flex;align-items:flex-end;padding:16px}
.sysbox{background:#fff;border-radius:18px;width:100%;overflow:hidden;animation:up .22s ease}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.sysbox .sb{padding:22px 20px 18px}
.sysbox .sb b{font-size:15px;font-weight:700;display:block}
.sysbox .sb p{font-size:14px;color:var(--ink60);margin-top:7px;line-height:1.45}
.sysbox .sf{display:flex;gap:8px;padding:0 16px 16px}
.sysbox .sf button{flex:1;height:50px;border-radius:var(--r);font-size:15px;font-weight:600;background:var(--base);color:var(--ink)}
.sysbox .sf button+button{background:var(--black);color:#fff}

/* 무반응 */
.nothing{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:0 32px;background:#fff}
.nothing b{font-size:19px;font-weight:700;letter-spacing:-.03em}
.nothing p{font-size:13.5px;color:var(--ink60);text-align:center;line-height:1.65}
.nothing .tagx{margin-top:16px;font-size:12px;font-weight:600;color:var(--alert);background:#FDECEC;padding:7px 13px;border-radius:99px}

/* ---------- air링크 페이지 ---------- */
.page{min-height:100%;display:flex;flex-direction:column;padding:34px 22px 76px;background:var(--pg-bg);color:var(--pg-fg)}
.page[data-theme=paper]{--pg-bg:#fff;--pg-fg:#111417;--pg-btn:#fff;--pg-bd:#E6E8EB;--pg-mute:#8B9096;--pg-acc:#2C64F6;--pg-logo:#000}
.page[data-theme=ink]{--pg-bg:#111417;--pg-fg:#fff;--pg-btn:#1C1F24;--pg-bd:#30343B;--pg-mute:#959BA4;--pg-acc:#FFCC00;--pg-logo:#fff}
.page[data-theme=cobalt]{--pg-bg:#2C64F6;--pg-fg:#fff;--pg-btn:rgba(255,255,255,.14);--pg-bd:rgba(255,255,255,.3);--pg-mute:rgba(255,255,255,.75);--pg-acc:#FFCC00;--pg-logo:#fff}
.page[data-theme=signal]{--pg-bg:#FFCC00;--pg-fg:#111417;--pg-btn:rgba(255,255,255,.55);--pg-bd:rgba(17,20,23,.14);--pg-mute:rgba(17,20,23,.6);--pg-acc:#2C64F6;--pg-logo:#000}
.pg-num{text-align:center;font-size:15px;font-weight:800;letter-spacing:.04em}
.pg-num em{font-style:normal;color:var(--pg-acc)}
.pg-av{width:90px;height:90px;border-radius:50%;margin:20px auto 14px;overflow:hidden;background:var(--pg-btn);border:1px solid var(--pg-bd);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.pg-av img{width:100%;height:100%;object-fit:cover}
.pg-name{text-align:center;font-size:20px;font-weight:700;letter-spacing:-.03em}
.pg-bio{text-align:center;font-size:13.5px;line-height:1.6;color:var(--pg-mute);margin-top:7px;white-space:pre-line}
.pg-links{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.pg-link{min-height:58px;border-radius:var(--rc);background:var(--pg-btn);border:1px solid var(--pg-bd);display:flex;align-items:center;gap:12px;padding:0 16px;font-size:14.5px;font-weight:600;color:var(--pg-fg);text-align:left;width:100%;transition:transform .07s}
.pg-link:active{transform:scale(.98)}
.pg-link .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-link .go{color:var(--pg-mute);flex:0 0 auto;display:flex}
.ico{width:30px;height:30px;border-radius:9px;flex:0 0 30px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}
.ico svg{width:15px;height:15px}
.pg-foot{margin-top:auto;padding-top:28px;text-align:center}
.pg-cta{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--pg-fg);border:1px solid var(--pg-bd);border-radius:99px;padding:10px 16px}
.pg-brand{display:flex;align-items:flex-end;justify-content:center;gap:3px;margin-top:16px;font-size:11.5px;font-weight:700;color:var(--pg-fg);line-height:1}
.pg-brand .logo{height:12px}
.pg-brand .logo path[fill="#000"]{fill:var(--pg-logo)}
.pg-rep{font-size:11px;color:var(--pg-mute);margin-top:8px}
.urlbar{height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;gap:7px;background:#F6F7F9;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink40);font-weight:600}
.urlbar b{color:var(--ink60);font-weight:600}
.urlbar .lk{font-size:11px}

/* ---------- URL 이동 ---------- */
.leaving{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fff;padding:0 28px}
.leaving .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.leaving b{font-size:19px;font-weight:700;letter-spacing:-.03em;text-align:center}
.leaving .u{font-size:13px;color:var(--ink40);text-align:center;word-break:break-all;line-height:1.5}
.leaving .ok{font-size:12.5px;color:var(--blue);font-weight:600;background:var(--blue-soft);padding:7px 13px;border-radius:99px;margin-top:4px}
.leaving .ic{width:56px;height:56px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center}

/* ---------- 빈 넘버 ---------- */
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 28px;gap:9px;background:#fff}
.empty .bn{font-size:34px;font-weight:800;color:var(--ink20);letter-spacing:-.035em}
.empty b{font-size:19px;font-weight:700;letter-spacing:-.03em;margin-top:12px}
.empty p{font-size:13.5px;color:var(--ink60)}

/* ---------- 하단 액션 ---------- */
.btn{width:100%;height:56px;border-radius:var(--r);background:var(--black);color:#fff;font-size:16px;font-weight:600;letter-spacing:-.02em}
.btn.sec{background:var(--base);color:var(--ink)}
#toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,10px);z-index:95;background:rgba(11,15,16,.92);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:all .22s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.mini{position:absolute;left:0;right:0;bottom:0;z-index:7;display:flex;gap:6px;padding:10px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.14))}
.mini button{flex:1;font-size:12.5px;font-weight:600;height:40px;border-radius:var(--r);background:rgba(11,15,16,.82);color:#fff}
</style>
</head>
<body>

<aside id="aside">
  <div class="kick">air링크 MVP</div>
  <h1>뷰어</h1>
  <p>넘버를 받은 사람이 다이얼로 눌러 페이지를 여는 화면입니다. 페이지 내용은 <b>에디터 화면</b>에서 만듭니다.</p>

  <div class="flow" id="flow"></div>

  <div class="cond">
    <h4>발신자 조건</h4>
    <div id="conds"></div>
    <button class="reset" id="reset">처음부터 다시</button>
    <button class="wipe" id="wipe">데모 초기화</button>
    <button class="io" id="exp">시연 데이터 내보내기</button>
    <button class="io" id="imp">데이터 불러오기</button>
    <input type="file" id="impfile" accept="application/json,.json" hidden>

  </div>
</aside>

<div id="device">
  <div class="statusbar" id="sbar"><span id="clock">9:41</span><span id="net">air 5G</span></div>
  <div class="view" id="view"></div>
  <div id="toast"></div>
</div>

<script>
/* ============================================================
   air링크 MVP — 뷰어 (발신자 플로우)
   다이얼 → 넘버* 통화 → air링크 페이지 → URL 이동
   ============================================================ */

var KEY='numberlink.mvp.v5';  /* 에디터와 같은 저장소 — 키는 유지 */
/* air 공식 로고 (logo_air_big.svg) — 여러 번 인라인되므로 필터(id)는 빼고 도형만 사용 */

  '<path d="M80.9368 34.1701L80.9368 48.9694C78.1258 45.3576 74.7161 42.2374 70.7976 39.6879C63.7609 35.1109 55.7067 32.7891 46.8581 32.7891C38.2454 32.7891 30.2346 35.1747 23.0459 39.8761C15.9193 44.5381 10.2323 50.9544 6.13689 58.9428C2.06321 66.8858 0 75.712 0 85.1786C0 94.6421 2.06321 103.483 6.13378 111.457C10.2292 119.479 15.9193 125.91 23.0428 130.575C30.2284 135.28 38.2702 137.662 46.9419 137.662C55.7873 137.662 63.8261 135.355 70.8317 130.812C74.7316 128.281 78.1258 125.179 80.9275 121.579L80.9275 136.063L102.357 136.063L102.357 34.1761L80.9368 34.1701ZM80.0805 92.7573C79.4227 96.0504 78.3337 99.1766 76.8197 102.096C74.1794 107.189 70.5711 111.272 66.1034 114.222C61.7039 117.129 56.8019 118.601 51.5368 118.601C46.2562 118.601 41.3449 117.169 36.9361 114.34C32.4777 111.481 28.8818 107.469 26.2478 102.415C23.5982 97.3403 22.2547 91.519 22.2454 85.1178C22.2547 78.7167 23.5982 72.8984 26.2478 67.8237C28.8818 62.7701 32.4777 58.7577 36.9361 55.8986C41.3418 53.0698 46.2562 51.6373 51.5368 51.6373C56.8019 51.6373 61.7039 53.1123 66.1034 56.017C70.5742 58.9701 74.1794 63.0494 76.8197 68.1423C78.3337 71.0621 79.4258 74.1883 80.0805 77.4814C80.9771 82.1373 80.9771 88.0984 80.0805 92.7573Z" fill="#000"/>'+
'</svg>';
var CHEVR='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

  /* 예전 저장분의 이전 명칭(넘버링크)도 바꿔준다 */

  return d;
}

/* ---------- utils ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){ if(!n) return ''; return n.length>4 ? n.slice(0,4)+'-'+n.slice(4) : n; }
function shortlink(n){return 'num.kr/'+n}
function platform(u){for(var i=0;i<PLATFORMS.length;i++){if(PLATFORMS[i].m.test(u))return PLATFORMS[i]}return null}
function iconMarkup(p){
  var bg=p?p.c:'var(--ink40)', fg=(p&&p.fg)?p.fg:'#fff';
  return '<span class="ico" style="background:'+bg+';color:'+fg+'">'+(p?esc(p.t):ICONS.link)+'</span>';
}
function toast(m){
  var t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on')},1800);
}

function exportDemo(){
  try{
    var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    var u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download='airlink-demo.json';a.click();
    setTimeout(function(){URL.revokeObjectURL(u)},2000);
    toast('시연 데이터를 내보냈어요');
  }catch(e){ toast('내보내기에 실패했어요'); }
}
function importDemo(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!d.pages) throw new Error('bad');
      localStorage.setItem(KEY,JSON.stringify(d));
      location.reload();
    }catch(e){ toast('불러올 수 없는 파일이에요'); }
  };
  r.readAsText(file);
}

$('#view').addEventListener('click',function(e){
  var b=e.target.closest('[data-a]'); if(!b) return;
  var a=b.dataset.a,v=b.dataset.v;

  if(a==='dk'){ if(dialVal.length<12){dialVal+=v;render()} return; }
  if(a==='dkdel'){ dialVal=dialVal.slice(0,-1); return render(); }
  if(a==='demo'){ dialVal=nextDemo()+'*'; demoIdx++; return render(); }

  if(a==='call'){
    var m=dialVal.match(/^(\d{4})\*$/); if(!m) return;
    target=m[1];
    setStage('calling');
    clearTimer();
    timer=setTimeout(function(){ setStage('notify'); },1800);
    return;
  }

  if(a==='open'){
    var p=S.pages[target];
    if(p&&p.direct&&p.links.length===1){
      leavingUrl=p.links[0].url; return leave();
    }
    if(p){ p.stats=p.stats||{views:0,today:0,src:{}}; p.stats.views++; p.stats.today++;
           p.stats.src=p.stats.src||{}; p.stats.src.dial=(p.stats.src.dial||0); save(); }
    return setStage('page');
  }

  if(a==='goto'){
    var pg=S.pages[target];
    leavingUrl=pg.links[Number(v)].url;
    return leave();
  }

  if(a==='backpage') return setStage('page');

  if(a==='restart'){
    clearTimer(); dialVal=''; target=null; leavingUrl='';
    return setStage('dial');
  }
});

function leave(){
  setStage('leaving');
  clearTimer();
  timer=setTimeout(function(){
    try{ window.open(leavingUrl,'_blank','noopener'); }catch(e){}
    setStage('left');
  },900);
}

(function clock(){
  var d=new Date();
  $('#clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  setTimeout(clock,20000);
})();
render();
</script>
</body>
</html>
